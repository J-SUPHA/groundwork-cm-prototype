<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groundwork CM — Construction Management Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2ED; --card:#FFFFFF; --ink:#1B1A17; --ink2:#3C3A34; --muted:#706C62;
    --border:#E1DDD3; --border-strong:#CFCABE;
    --accent:#E85D0E; --accent-dark:#B8430A; --accent-soft:#FBEADD;
    --steel:#2C3944; --ok:#1D7A46; --ok-soft:#E3F1E8; --warn:#9A6A00; --warn-soft:#F7EDD6;
    --danger:#B3261E; --danger-soft:#F8E5E3; --offline:#8A867C;
    --side:#211F1A; --side-ink:#EFEDE6; --side-muted:#9B968A;
    --r:10px; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font:400 14px/1.5 'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{font-weight:700;letter-spacing:-.01em}

  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

  /* ---------- sidebar ---------- */
  aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid #3A372F;margin-bottom:14px}
  .logo-mark{width:30px;height:30px;flex:none}
  .logo b{font:800 15px 'Archivo';letter-spacing:.02em}
  .logo small{display:block;font:500 9px var(--mono);letter-spacing:.14em;color:var(--side-muted);text-transform:uppercase}
  .nav-label{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
  aside nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--side-muted);font-weight:600;text-align:left;transition:.15s}
  aside nav button:hover{color:var(--side-ink);background:#2B2922}
  aside nav button.active{color:#fff;background:var(--accent)}
  aside nav button .icn{width:16px;text-align:center;font-family:var(--mono);font-size:11px;opacity:.8}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid #3A372F}
  .reset{width:100%;padding:8px;border:1px solid #3A372F;border-radius:8px;color:var(--side-muted);font:600 11px var(--mono);letter-spacing:.08em}
  .reset:hover{color:var(--side-ink);border-color:#57534a}

  /* ---------- topbar ---------- */
  main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .crumb{font:700 17px 'Archivo'}
  .crumb span{color:var(--muted);font-weight:500}
  .role-switch{margin-left:auto;display:flex;background:var(--paper);border:1px solid var(--border);border-radius:9px;padding:3px}
  .role-switch button{padding:6px 14px;border-radius:6px;font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.02em}
  .role-switch button.active{background:var(--steel);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .persona{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid var(--border)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center;font:700 11px 'Archivo'}
  .avatar.o{background:var(--accent)}
  .avatar.c{background:#6D5B3E}
  .persona b{display:block;font-size:12.5px;line-height:1.2}
  .persona small{color:var(--muted);font-size:11px}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,122,70,.5)}70%{box-shadow:0 0 0 6px rgba(29,122,70,0)}100%{box-shadow:0 0 0 0 rgba(29,122,70,0)}}
  @media (prefers-reduced-motion:reduce){.live-dot{animation:none}}

  #view{padding:26px;max-width:1180px;width:100%}

  /* ---------- generic ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;transition:.15s}
  .btn.pri{background:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent-dark)}
  .btn.sec{background:var(--card);border:1px solid var(--border-strong);color:var(--ink2)}
  .btn.sec:hover{border-color:var(--ink2)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(27,26,23,.04)}
  .card-pad{padding:20px}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{padding:16px 18px}
  .kpi .k{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font:800 30px 'Archivo';margin-top:2px}
  .kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
  .sec-head h2{font-size:16px}
  .sec-head .hint{color:var(--muted);font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:700 11px 'Archivo';letter-spacing:.02em}
  .pill.phase{background:#EDEFF1;color:#3A4A58}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.danger{background:var(--danger-soft);color:var(--danger)}
  .pill.off{background:#EFEDE7;color:var(--offline)}
  .pill.accent{background:var(--accent-soft);color:var(--accent-dark)}
  .bar{height:6px;background:#EDEAE1;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:.12s}
  tbody tr.clickable:hover{background:#FAF8F3;cursor:pointer}
  .toast-wrap{position:fixed;bottom:22px;left:236px;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:99;pointer-events:none}
  .toast{background:var(--steel);color:#fff;padding:11px 18px;border-radius:9px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:tin .25s ease-out}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

  /* ---------- projects ---------- */
  .proj-grid{grid-template-columns:repeat(3,1fr)}
  .proj-card{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s}
  .proj-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(232,93,14,.09);transform:translateY(-1px)}
  .proj-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .proj-card h3{font-size:15px}
  .proj-card .addr{font-size:12px;color:var(--muted)}
  .stat-row{display:flex;gap:16px;font-size:11.5px;color:var(--muted)}
  .stat-row b{color:var(--ink);font-family:var(--mono);font-weight:600}
  .team{display:flex}
  .team .avatar{width:24px;height:24px;font-size:9px;border:2px solid #fff;margin-left:-7px}
  .team .avatar:first-child{margin-left:0}
  .due{font:500 11px var(--mono);color:var(--muted)}

  /* ---------- detail ---------- */
  .dhead{display:flex;gap:24px;align-items:center}
  .ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ring .inner{width:86px;height:86px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
  .ring b{font:800 24px 'Archivo';display:block}
  .ring small{font:600 9px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .stepper{display:flex;margin:22px 0 6px}
  .step{flex:1;position:relative;padding-top:22px;font:600 11px 'Archivo';color:var(--muted)}
  .step::before{content:'';position:absolute;top:6px;left:0;right:0;height:3px;background:#E7E3D9}
  .step::after{content:'';position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:#E7E3D9;border:2px solid var(--card);box-shadow:0 0 0 1px var(--border-strong)}
  .step.done{color:var(--ink2)}
  .step.ctl{cursor:pointer}
  .step.ctl:hover{color:var(--accent-dark)}
  .step.done::before{background:var(--ok)}
  .step.done::after{background:var(--ok)}
  .step.now{color:var(--accent-dark);font-weight:800}
  .step.now::before{background:linear-gradient(90deg,var(--ok),var(--accent))}
  .step.now::after{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
  .feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
  .feed-item:last-child{border-bottom:none}
  .feed-item .fa{width:26px;height:26px;border-radius:50%;font-size:9px;font-weight:700;display:grid;place-items:center;color:#fff;background:var(--steel);flex:none;margin-top:2px}
  .feed-item .ft{font-size:12.5px}
  .feed-item .fm{font:500 10.5px var(--mono);color:var(--muted)}

  /* ---------- forms / modals ---------- */
  .overlay{position:fixed;inset:0;background:rgba(27,26,23,.5);display:grid;place-items:center;z-index:50;padding:24px}
  .modal{background:var(--card);border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center}
  .modal-h h3{font-size:16px}
  .modal-h .x{margin-left:auto;color:var(--muted);font-size:18px;padding:4px}
  .modal-b{padding:22px}
  .modal-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .field{margin-bottom:16px}
  .field label{display:block;font:700 12px 'Archivo';margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:#FCFBF8}
  .field input[type=checkbox],.field input[type=radio]{width:auto;padding:0}
  .check-row span{flex:1;min-width:0}
  .check-row small{flex:none}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .role-card{border:1.5px solid var(--border-strong);border-radius:10px;padding:14px 12px;text-align:left;cursor:pointer;transition:.15s}
  .role-card b{display:block;font-size:13px;margin-bottom:4px}
  .role-card span{font-size:11px;color:var(--muted);line-height:1.4;display:block}
  .role-card.sel{border-color:var(--accent);background:var(--accent-soft)}
  .check-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
  .check-row small{color:var(--muted);margin-left:auto;font-family:var(--mono);font-size:10.5px}
  .steps-ind{display:flex;gap:6px;margin-left:12px}
  .steps-ind i{width:22px;height:4px;border-radius:99px;background:#E7E3D9}
  .steps-ind i.on{background:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .range-val{font:700 26px var(--mono);color:var(--accent-dark)}

  /* ---------- inventory ---------- */
  .stepctl{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
  .stepctl button{width:32px;height:32px;font:700 16px var(--mono);color:var(--ink2)}
  .stepctl button:hover{background:var(--accent-soft);color:var(--accent-dark)}
  .stepctl .q{min-width:56px;text-align:center;font:600 14px var(--mono)}
  tr.low td{background:var(--warn-soft)}
  .use{width:120px}

  /* ---------- equipment ---------- */
  .eq-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
  .eq-dot.in-use{background:var(--ok);animation:pulse 1.6s infinite}
  .eq-dot.idle{background:var(--warn)}
  .eq-dot.offline{background:var(--offline)}
  .eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .eq-card{padding:16px;display:flex;gap:14px;align-items:center}
  .eq-icon{width:46px;height:46px;border-radius:10px;background:#EDEFF1;display:grid;place-items:center;font:700 11px var(--mono);color:#3A4A58;flex:none}
  .eq-card h4{font-size:14px}
  .eq-meta{font-size:11.5px;color:var(--muted)}
  .eq-ping{font:500 10.5px var(--mono);color:var(--muted);margin-left:auto;text-align:right}

  /* ---------- benchmark ---------- */
  .bench-bars .brow{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:14px;margin-bottom:10px}
  .bench-bars .bl{font-size:12.5px;font-weight:600}
  .bench-bars .btrack{height:14px;background:#EDEAE1;border-radius:5px;overflow:hidden}
  .bench-bars .bfill{height:100%;border-radius:5px}
  .bench-bars .bv{font:600 12px var(--mono);text-align:right}
  .current-tag{font:700 9px var(--mono);letter-spacing:.1em;background:var(--accent-soft);color:var(--accent-dark);padding:2px 7px;border-radius:4px;margin-left:8px;text-transform:uppercase}

  /* ---------- client ---------- */
  .client-hero{display:flex;gap:28px;align-items:center;padding:28px}
  .phase-tl{display:flex;margin-top:8px}
  .pnode{flex:1;text-align:center;font:600 10.5px 'Archivo';color:var(--muted);position:relative;padding-top:20px}
  .pnode::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#D8D4C9}
  .pnode.done{color:var(--ink2)}.pnode.done::before{background:var(--ok)}
  .pnode.now{color:var(--accent-dark);font-weight:800}.pnode.now::before{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
  .pnode::after{content:'';position:absolute;top:9px;left:-50%;width:100%;height:2px;background:#E7E3D9;z-index:-1}
  .pnode:first-child::after{display:none}
  .pnode.done::after{background:var(--ok)}

  .empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
  @media(max-width:1000px){.proj-grid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.eq-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="6" fill="#E85D0E"/><path d="M9 22 L16 9 L23 22" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="18" x2="20" y2="18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
      <div><b>GROUNDWORK</b><small>Construction Mgmt</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="reset" onclick="resetDemo()">⟲ &nbsp;RESET DEMO DATA</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumb" id="crumb">Overview</div>
      <div class="role-switch" id="roles">
        <button data-role="admin" onclick="setRole('admin')">Admin</button>
        <button data-role="worker" onclick="setRole('worker')">Worker</button>
        <button data-role="client" onclick="setRole('client')">Client</button>
      </div>
      <div class="persona" id="persona"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ============================================================
   GROUNDWORK CM — clickable prototype
   Demo state persists to localStorage. Reset via sidebar.
   ============================================================ */

let state;
try{ state = JSON.parse(localStorage.getItem('gw-state')) || seed(); }catch(e){ state = seed(); }
function save(){ localStorage.setItem('gw-state', JSON.stringify(state)); }
function resetDemo(){ localStorage.removeItem('gw-state'); state = seed(); render(); toast('Demo data reset'); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt$ = n => '$' + Math.round(n).toLocaleString();
const rel = t => { const s = Math.max(1,Math.round((Date.now()-t)/1e3));
  if(s<60) return s+'s ago'; const m=Math.round(s/60); if(m<60) return m+'m ago';
  const h=Math.round(m/60); if(h<24) return h+'h ago'; return Math.round(h/24)+'d ago'; };
const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const user = id => state.users.find(u=>u.id===id);
const proj = id => state.projects.find(p=>p.id===id);
const ME = { admin:()=>state.users.find(u=>u.role==='admin'), worker:()=>state.users.find(u=>u.id==='u2'), client:()=>state.users.find(u=>u.role==='client') };
const ROLE_META = {
  admin:{title:'Operations Director',view:'All projects'},
  worker:{title:'Site Foreman',view:'Assigned sites'},
  client:{title:'Aurora Development',view:'Your build'},
};
const NAV = {
  admin:[['overview','Overview'],['projects','Projects'],['workforce','Workforce & Roles'],['bench','Benchmarking'],['inv','Inventory'],['equip','Equipment']],
  worker:[['site','My Site'],['inv','Inventory'],['equip','Equipment']],
  client:[['live','Live Status']],
};
const DEFAULT_ROUTE = { admin:{screen:'overview'}, worker:{screen:'site'}, client:{screen:'live'} };
const avHtml = (u,cls='') => u?`<span class="avatar ${cls}" title="${esc(u.name)}">${initials(u.name)}</span>`:'';
const avCls = r => r==='admin'?'':r==='client'?'c':'o';

function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),320)},2600);
}

/* ---------- role / routing ---------- */
function setRole(r){ state.role = r; state.route = {...DEFAULT_ROUTE[r]}; save(); render(); }
function nav(screen, projectId){ state.route = {screen, projectId}; save(); render(); window.scrollTo(0,0); }
window.setRole = setRole; window.nav = nav; window.resetDemo = resetDemo;

function render(){
  // nav
  $('#nav').innerHTML = NAV[state.role].map(([id,label]) =>
    `<button class="${active(id)?'active':''}" onclick="nav('${id}')"><span class="icn">${{'overview':'▤','projects':'▦','workforce':'⚑','bench':'≋','equip':'⚙','site':'▶','inv':'▧','live':'●'}[id]||'·'}</span>${label}</button>`).join('');
  // role switch + persona
  document.querySelectorAll('#roles button').forEach(b => b.classList.toggle('active', b.dataset.role===state.role));
  const me = ME[state.role]();
  $('#persona').innerHTML = `
    ${avHtml(me, avCls(state.role))}
    <div><b>${esc(me.name)}</b><small>${ROLE_META[state.role].title} · ${ROLE_META[state.role].view}</small></div>`;
  // view
  const r = state.route, v = $('#view');
  const renderers = { overview, projects, projectDetail, workforce, bench, equip, site, inv, live };
  v.innerHTML = renderers[r.screen] ? renderers[r.screen]() : overview();
  tick(); // refresh relative-time labels immediately
}
function active(id){
  const r = state.route;
  if(r.screen===id) return true;
  if(id==='projects' && r.screen==='projectDetail') return true;
  return false;
}

/* ---- ADMIN: Benchmarking (Compare) ---- */
function bench(){
  crumb('Benchmarking <span>/ current vs. completed builds</span>');
  const cur = proj(state.route.projectId) || state.projects[0];
  const cols = [...state.past, currentAsBench(cur)];
  const mats = [
    {key:'concrete',label:'Concrete (yd³)'},
    {key:'steel',label:'Steel (tons)'},
    {key:'lumber',label:'Lumber (bd ft)'},
    {key:'drywall',label:'Drywall (sheets)'},
  ];
  return `
  <div class="sec-head" style="margin-top:0"><h2>Estimate vs. history</h2><span class="hint">Compare the active project against completed builds of similar scope</span></div>
  <div class="card card-pad" style="margin-bottom:16px;display:flex;gap:14px;align-items:center">
    <b style="font-size:13px">Active project:</b>
    <select onchange="nav('bench',this.value)" style="padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;font-weight:600">
      ${state.projects.map(p=>`<option value="${p.id}" ${p.id===cur.id?'selected':''}>${esc(p.name)}</option>`).join('')}
    </select>
    <span class="muted" style="font-size:12px">Material intensity is per 1,000 sq ft — comparable across project sizes.</span>
  </div>
  <div class="card" style="margin-bottom:16px;overflow:auto">
    <table><thead><tr><th></th>${cols.map(c=>`<th style="text-align:right">${esc(c.name)}${c.current?'<span class="current-tag">Current</span>':''}</th>`).join('')}</tr></thead>
    <tbody>
      ${[
        ['Completed', c=>c.current?`due ${proj(cur.id).due}`:c.completed],
        ['Size', c=>c.sqft.toLocaleString()+' sq ft'],
        ['Rooms / Units', c=>`${c.rooms.units} units · ${c.rooms.beds} bd / ${c.rooms.baths} ba · ${c.rooms.common} common`],
        ['Primary Materials', c=>c.materials.join(', ')],
        ['Duration', c=>c.duration?c.duration+' wks':'in progress'],
        ['Cost / sq ft', c=>c.cost?'$'+c.cost:'$'+Math.round(c.spent/c.sqft)+' (to date)'],
        ['Change Orders', c=>c.co!=null?c.co:'4 (open)'],
      ].map(([label,fn])=>`<tr><td style="color:var(--muted);font-weight:600;font-size:12px">${label}</td>${cols.map(c=>`<td style="text-align:right;font-size:12.5px;${c.current?'font-weight:700':''}">${fn(c)}</td>`).join('')}</tr>`).join('')}
    </tbody></table>
  </div>
  <div class="card card-pad">
    <h3 style="font-size:14px;margin-bottom:16px">Material intensity <span class="muted" style="font-weight:400;font-size:12px">— usage per 1,000 sq ft</span></h3>
    ${mats.map(m=>{
      const data = cols.map(c=>({name:c.name,current:c.current,v:c.use[m.key]||0}));
      const max = Math.max(...data.map(d=>d.v),1);
      return `<div class="bench-bars" style="margin-bottom:18px">
        <div style="font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${m.label}</div>
        ${data.map(d=>`<div class="brow"><span class="bl">${esc(d.name)}${d.current?'<span class="current-tag">Current</span>':''}</span>
          <div class="btrack"><div class="bfill" style="width:${Math.max(d.v/max*100, d.v?3:0)}%;background:${d.current?'var(--accent)':'#9BB0BE'}"></div></div>
          <span class="bv">${d.v||'—'}</span></div>`).join('')}
      </div>`;
    }).join('')}
    <div class="muted" style="font-size:12px;border-top:1px dashed var(--border);padding-top:12px">
      <b style="color:var(--accent-dark)">Read:</b> ${esc(cur.name)} tracks ${benchDelta(cur)} vs. ${esc(state.past[2].name)}, its closest comparable by program.
    </div>
  </div>`;
}
function currentAsBench(p){
  const per = k => Math.round(k / (p.sqft/1000));
  return {name:p.name,current:true,sqft:p.sqft,rooms:p.rooms,materials:p.materials,spent:p.spent,
    use:{concrete:per(p.materials.includes('Mass timber')?2600:4800),steel:per(p.materials.includes('Structural steel')?560:390),
         lumber:per(p.materials.includes('Mass timber')?1750:p.type.includes('Residential')||p.type.includes('Multi')?640:60),
         drywall:per(2900)}};
}
function benchDelta(cur){
  return cur.sqft>80000 ? '4% lower concrete intensity' : 'comparable material intensity';
}

/* ---- Phase advancement (admin + worker); backward moves require a reason ---- */
function setPhase(pid, i){
  const p = proj(pid); if(!p || i === p.phaseIdx) return;
  if(i < p.phaseIdx){ openPhaseBack(pid, i); return; }
  applyPhase(pid, i);
}
function applyPhase(pid, i, reason){
  const p = proj(pid); if(!p) return;
  const prev = PHASES[p.phaseIdx];
  p.phaseIdx = i;
  state.feed.push({projectId:pid, t:Date.now(), by:ME[state.role]().name, kind: reason ? 'note' : 'status',
    text: reason
      ? `Phase pulled back: ${prev} → ${PHASES[i]}. Reason: ${reason}`
      : `Phase updated to ${PHASES[i]} (${p.progress}% complete).`});
  save(); render(); toast(`Phase: ${PHASES[i]}`);
}
function advancePhase(pid){
  const p = proj(pid); if(!p) return;
  applyPhase(pid, Math.min(p.phaseIdx + 1, PHASES.length - 1));
}
function openPhaseBack(pid, i){
  const p = proj(pid); if(!p) return;
  window.__pb = {pid, i};
  openModal(`
    <div class="modal-h"><h3>Pull back a phase</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="card card-pad" style="background:var(--warn-soft);border:1px solid #E4D3A8;margin-bottom:16px;font-size:13px">
        Moving <b>${esc(p.name)}</b> back from <b>${esc(PHASES[p.phaseIdx])}</b> to <b>${esc(PHASES[i])}</b>.
        This posts to the client-visible project feed — a reason is required.
      </div>
      <div class="field"><label>Reason (required — e.g. failed inspection, rework, scope change)</label>
        <textarea id="pb-reason" rows="3" placeholder="Why is the project moving back?"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn sec" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="pbSave()">Move back to ${esc(PHASES[i])}</button></div>`);
}
function pbSave(){
  const reason = document.getElementById('pb-reason').value.trim();
  if(!reason){ toast('A reason is required to move a phase back'); return; }
  const {pid, i} = window.__pb;
  closeModal();
  applyPhase(pid, i, reason);
}
window.setPhase = setPhase; window.advancePhase = advancePhase;
window.openPhaseBack = openPhaseBack; window.pbSave = pbSave;

function inv(){

  const rows = state.inventory.filter(i=>myIds.includes(i.projectId));
  return `
  <div class="sec-head" style="margin-top:0"><h2>Material stock</h2><span class="hint">Adjust counts as deliveries arrive and materials are used</span>
    <button class="btn pri sm" style="margin-left:auto" onclick="openAddMaterial()">+ Add Material</button></div>
  <div class="card">

    <tbody>
    ${rows.map(i=>{
      const low = i.onHand<=i.par;
      const pct = Math.min(100, Math.round(i.onHand/i.required*100));
      return `<tr class="${low?'low':''}">
        <td><b>${esc(i.item)}</b><div class="muted" style="font-size:11px">${esc(i.unit)}</div></td>
        <td style="font-size:12px">${esc(proj(i.projectId).name)}</td>

        <td class="use"><div class="bar"><i style="width:${pct}%;background:${low?'var(--warn)':'var(--ok)'}"></i></div><span class="muted mono" style="font-size:10.5px">${pct}% of ${i.required}</span></td>
        <td>${low?'<span class="pill warn">Low — below par</span>':'<span class="pill ok">In stock</span>'}</td>
        <td style="text-align:right">${low?`<button class="btn sec sm" onclick="reorder('${i.id}')">Request order</button>`:''}</td>

function adjust(iid,delta,kind){
  const i = state.inventory.find(x=>x.id===iid);

  save(); render();
}
function reorder(iid){ const i=state.inventory.find(x=>x.id===iid); toast(`PO requested: ${i.item} → ${proj(i.projectId).name}`); }

function wizGrab(){

function wizTeam(id,on){ const t=window.__wiz.data.team; on?t.push(id):t.splice(t.indexOf(id),1); }
function wizBack(){ window.__wiz.step--; wizRender(); }
function wizNext(){
  wizGrab(); const w = window.__wiz, d = w.data;
  if(w.step===1 && !d.name){ toast('Give the project a name first'); return; }
  if(w.step<3){ w.step++; wizRender(); return; }

  const id = 'p'+(state.seq++);
  const p = { id, name:d.name, type:d.type, address:d.address||'—', sqft:+d.sqft||10000, budget:+d.budget||1000000, spent:0,

    rooms:{units:+d.units||0,beds:+d.beds||0,baths:+d.baths||0,common:+d.common||0},
    materials:d.mats.length?d.mats:['General construction'], team:d.team.length?d.team:['u1'] };
  state.projects.push(p);
  d.team.forEach(uid=>{ if(!user(uid).projects.includes(id)) user(uid).projects.push(id); });
  if(!user('u1').projects.includes(id)) user('u1').projects.push(id);
  state.feed.push({projectId:id,t:Date.now(),by:'Dana Kim',kind:'note',text:`Project created: ${p.name}. Mobilization scheduled.`});
  save(); closeModal(); nav('projectDetail', id); toast('Project created and team assigned');
}

function obPaint(){ document.querySelectorAll('.role-card').forEach(c=>c.classList.toggle('sel', c.dataset.r===window.__onb.role)); }
function obSave(){
  const o = window.__onb, name = document.getElementById('ob-name').value.trim(), email = document.getElementById('ob-email').value.trim();
  if(!name){ toast('Name is required'); return; }
  const projs = state.projects.filter(p=>document.getElementById('obp-'+p.id).checked).map(p=>p.id);
  if(o.editId){
    const u = user(o.editId); u.name = name||u.name; u.email = email||u.email; u.role = o.role; u.projects = projs;
    save(); closeModal(); render(); toast('User updated'); return;
  }
  const id = 'u'+(state.seq++);
  state.users.push({id, name, email:email||name.toLowerCase().replace(/\s+/g,'.')+'@pending-invite', role:o.role, projects:projs});
  save(); closeModal(); nav('workforce'); toast(`Invite sent to ${name} (${o.role})`);
}
window.openOnboard=openOnboard; window.obRole=obRole; window.obSave=obSave;

/* ============================================================
   LIVE TICK — relative times + equipment telemetry drift
   ============================================================ */
function tick(){
  document.querySelectorAll('[data-rel]').forEach(el=>{ el.textContent = rel(+el.dataset.rel); });
}
let drift = 0;
setInterval(()=>{
  // heartbeat on one random unit
  const e = state.equipment[Math.floor(Math.random()*state.equipment.length)];
  if(e && e.status!=='offline'){ e.ping = Date.now(); }
  // occasional status drift (idles come online, etc.)
  if(++drift % 9 === 0){
    const e2 = state.equipment[Math.floor(Math.random()*state.equipment.length)];
    if(e2 && e2.status==='idle' && Math.random()<.5){ e2.status='in-use'; e2.operator='J. Alvarez'; e2.ping=Date.now();
      save(); if(['equip','live','projectDetail'].includes(state.route.screen) && !window.__wiz && !window.__onb) render(); }
  }
  tick();
}, 1000);

render();
</script>
